<style>
/* Artwork is authored at a fixed 800x541 and scaled by script to fit
   whatever box it is placed in (including a Framer embed iframe). */
html, body { margin: 0; padding: 0; height: 100%; background: #21212f; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }

.stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
/* Centred by script; scale(0) until measured so no unscaled frame flashes. */
.stage > div {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 0));
}
</style>

@keyframes led { 0%, 62% { opacity: 1; } 68%, 100% { opacity: .25; } }
@keyframes tick { to { transform: rotate(360deg); } }
@keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-14px, 5px); } }
@keyframes moonrise { 0% { transform: translateY(6px); } 100% { transform: translateY(-6px); } }

<script>
// Fit the fixed 800x541 artwork inside whatever box the page is given.
// Done in script because CSS length division (100cqw / 800px) is not
// supported everywhere -- notably it fails inside Framer.
(function () {
  var ART_W = 800, ART_H = 541;
  var stage = document.querySelector('.stage');
  var art = stage && stage.firstElementChild;
  if (!art) return;

  function fit() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    // Contain: never crop, never distort.
    art.style.setProperty('--s', Math.min(w / ART_W, h / ART_H));
  }

  fit();
  if (window.ResizeObserver) {
    new ResizeObserver(fit).observe(stage);
  } else {
    window.addEventListener('resize', fit);
  }
  window.addEventListener('load', fit);
})();
</script>
